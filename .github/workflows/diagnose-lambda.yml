# One-shot AWS diagnostic. Runs with the repository's AWS secrets and prints
# what actually exists in the account, then attempts a tiny real render so the
# true error appears in the log. Safe to delete once rendering works.
name: Diagnose Lambda

on:
  push:
    paths: [".github/workflows/diagnose-lambda.yml"]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.REMOTION_AWS_REGION || 'us-east-2' }}
      REMOTION_AWS_REGION: ${{ vars.REMOTION_AWS_REGION || 'us-east-2' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-package-lock --no-audit --no-fund

      - name: Who do these keys belong to
        continue-on-error: true
        run: |
          ID=$(aws sts get-caller-identity --output json || echo '{}')
          ACC=$(echo "$ID" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("Account",""))' 2>/dev/null || true)
          ARN=$(echo "$ID" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("Arn",""))' 2>/dev/null || true)
          echo "account_last4=${ACC: -4}"
          echo "principal=$(echo "$ARN" | sed 's#.*/##')"

      - name: Lambda functions that exist in this account
        continue-on-error: true
        run: npx remotion lambda functions ls --region="$REMOTION_AWS_REGION"

      - name: Sites (bundles) that exist in this account
        continue-on-error: true
        run: npx remotion lambda sites ls --region="$REMOTION_AWS_REGION"

      - name: Buckets Remotion can see
        continue-on-error: true
        run: aws s3 ls | grep remotionlambda || echo "no remotionlambda-* bucket visible to these keys"

      - name: Attempt a real 2-second render
        continue-on-error: true
        run: |
          cat > /tmp/props.json <<'JSON'
          {
            "audioUrl": "https://remotion-assets.s3.eu-central-1.amazonaws.com/silence.mp3",
            "durationSeconds": 2, "fps": 30, "width": 640, "height": 360,
            "backgroundUrl": null, "backgroundType": null, "backgroundColor": "#0a0612", "logoUrl": null,
            "visualizer": { "presetId": "circular-spectrum", "primary": "#22e3ff", "secondary": "#b14bff", "accent": "#ff4bd1", "glow": "#22e3ff", "overlay": "#000000", "overlayOpacity": 0.35, "glowIntensity": 0.8, "blur": 0, "size": 1, "thickness": 4, "position": { "x": 0, "y": 0 }, "logoSize": 0.35, "logoPosition": { "x": 0, "y": 0 }, "backgroundScale": 1, "backgroundBlur": 0, "backgroundTint": "#0a0612", "backgroundTintOpacity": 0, "animationSpeed": 1, "sensitivity": 1.2, "bassSensitivity": 1.3, "midSensitivity": 1, "trebleSensitivity": 1, "smoothing": 0.5, "rotation": 0, "movement": 0, "shadow": 0, "border": 0, "blendMode": "source-over", "reactivity": 1, "bandCount": 48, "stationary": true, "custom": { "shape": "bars", "count": 48, "spacing": 0.25, "amplitude": 1, "thickness": 0, "rounded": true, "symmetric": false, "reactivity": 1, "innerRadius": 0.35 } },
            "effects": { "particles": { "enabled": false, "type": "dust", "density": 10, "speed": 0.4, "color": "#ffffff", "opacity": 0.3, "reactivity": 0.3 }, "beatFlash": false, "vignette": true, "noise": false, "lensFlare": false },
            "lyrics": { "enabled": false, "lines": [], "style": "Subtitle", "position": "bottom", "fontFamily": "Arial", "fontSize": 42, "color": "#ffffff", "outline": true, "shadow": true, "glow": false, "fade": true },
            "title": "diagnostic", "engineVersion": 2, "quality": "standard"
          }
          JSON
          FN=$(npx remotion lambda functions ls --region="$REMOTION_AWS_REGION" --quiet 2>/dev/null | head -1 | awk '{print $1}')
          SITE=$(npx remotion lambda sites ls --region="$REMOTION_AWS_REGION" --quiet 2>/dev/null | head -1 | awk '{print $NF}')
          echo "using function: ${FN:-<none found>}"
          echo "using site:     ${SITE:-<none found>}"
          if [ -z "$FN" ] || [ -z "$SITE" ]; then
            echo "::error::Missing function or site in this account — that alone explains a render that never starts."
            exit 1
          fi
          npx remotion lambda render "$SITE" Visualizer \
            --function-name="$FN" \
            --region="$REMOTION_AWS_REGION" \
            --props=/tmp/props.json \
            --log=verbose 2>&1 | tail -60
