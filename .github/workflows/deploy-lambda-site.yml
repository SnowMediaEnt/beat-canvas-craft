# Re-uploads the visualizer bundle that AWS Lambda renders with.
#
# Runs automatically when drawing code lands on main, and can be started by
# hand from the Actions tab ("Run workflow"). Needs two repository secrets
# (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY   the IAM user Remotion uses
# Optional repository variables (same page, "Variables" tab):
#   REMOTION_SITE_NAME   default lyrics-viz
#   REMOTION_AWS_REGION  default us-east-2
name: Deploy Lambda site

on:
  push:
    branches: [main]
    paths:
      - "src/lib/visualizer/**"
      - "src/lib/project/types.ts"
      - "src/lib/render/input-schema.ts"
      - "src/remotion/**"
      - "package.json"
      - ".github/workflows/deploy-lambda-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-lambda-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      REMOTION_SITE_NAME: ${{ vars.REMOTION_SITE_NAME || 'lyrics-viz' }}
      REMOTION_AWS_REGION: ${{ vars.REMOTION_AWS_REGION || 'us-east-2' }}
    steps:
      - name: Check that the AWS secrets exist
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::Missing AWS_ACCESS_KEY_ID and/or AWS_SECRET_ACCESS_KEY. Add them under Settings → Secrets and variables → Actions → Repository secrets, with exactly those names."
            exit 1
          fi
          echo "Secrets present. Site: $REMOTION_SITE_NAME, region: $REMOTION_AWS_REGION"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Upload the visualizer bundle to S3
        run: |
          npx remotion lambda sites create src/remotion/index.ts \
            --site-name="$REMOTION_SITE_NAME" \
            --region="$REMOTION_AWS_REGION" \
            --log=info | tee deploy.log
          URL=$(grep -oE 'https://[^[:space:]]+/index\.html' deploy.log | tail -1)
          {
            echo "### Lambda bundle deployed"
            echo ""
            echo "Site \`$REMOTION_SITE_NAME\` in \`$REMOTION_AWS_REGION\`, commit \`${GITHUB_SHA::7}\`."
            if [ -n "$URL" ]; then
              echo ""
              echo "Serve URL: $URL"
              echo ""
              echo "This must match the \`REMOTION_AWS_SERVE_URL\` secret in Lovable."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
